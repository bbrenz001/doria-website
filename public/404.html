<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Esta página no existe. Vuelve al sitio de Doria Alvarez.">
  <title>Página no encontrada — Doria Alvarez</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracotta:    #8B3A2A;
      --terracotta-dk: #6e2d1e;
      --cream:         #FAF6F1;
      --blush:         #F0E8DF;
      --ink:           #2C1810;
      --ink-mid:       #5a3a2d;
      --serif:         'Cormorant Garamond', Georgia, serif;
      --sans:          'DM Sans', system-ui, sans-serif;
    }

    html { font-size: 16px; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: 32rem;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 2.5rem;
      color: var(--ink);
      margin-bottom: 1rem;
    }

    p {
      color: var(--ink-mid);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: var(--terracotta);
      color: var(--cream);
      font-family: var(--sans);
      font-weight: 500;
      padding: 0.85em 1.75em;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--terracotta-dk);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">404</p>
    <h1>Esta página no existe</h1>
    <p>El enlace que seguiste no lleva a ningún lado, o la página ya no está aquí.</p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</body>
</html>
