<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Gracias por escribir a Doria Alvarez.">
  <title>Gracias — Doria Alvarez</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --terracotta:    #8B3A2A;
      --terracotta-dk: #6e2d1e;
      --cream:         #FAF6F1;
      --blush:         #F0E8DF;
      --blush-dk:      #e0d0c4;
      --ink:           #2C1810;
      --ink-mid:       #5a3a2d;
      --serif:         'Cormorant Garamond', Georgia, serif;
      --sans:          'DM Sans', system-ui, sans-serif;
    }

    body {
      background: var(--blush);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      text-align: center;
    }

    .eyebrow {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 1rem;
      color: var(--ink-mid);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 1.75rem;
      background: var(--terracotta);
      color: var(--cream);
      border: 1px solid var(--terracotta);
      transition: background 0.25s, border-color 0.25s;
    }
    .btn:hover { background: var(--terracotta-dk); border-color: var(--terracotta-dk); }

    a { text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Mensaje recibido</p>
    <h1>Gracias por escribir.</h1>
    <p>
      Leo cada mensaje personalmente. Te responderé dentro de las próximas 24 horas,
      normalmente antes. Si es urgente, también puedes escribirme por WhatsApp.
    </p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</body>
</html>
